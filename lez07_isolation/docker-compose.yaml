services:
  db:
    image: mysql:latest
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: toor
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      timeout: 3s
      retries: 5
      interval: 5s
    networks:
      - network_backend

  backend:
    image: tomcat:9.0.123-jre25-temurin-noble
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - network_backend
      - network_frontend

  frontend:
    image: nginx:latest
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - network_frontend

networks:
  network_backend:
    driver: bridge
  network_frontend:
    driver: bridge